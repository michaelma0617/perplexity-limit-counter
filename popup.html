<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #20808d;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
      font-weight: 600;
    }

    #content {
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-height: 200px;
    }

    .limit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
    }

    .limit-item:last-child {
      border-bottom: none;
    }

    .limit-label {
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    .limit-value {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      padding: 4px 12px;
      background: #f0f0f0;
      border-radius: 12px;
    }

    .limit-value.highlight {
      background: #20808d;
      color: white;
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    #refresh {
      background: #20808d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }

    #refresh:hover:not(:disabled) {
      background: #1a6b75;
    }

    #refresh:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error-message {
      text-align: center;
      color: #d32f2f;
      padding: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #20808d;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Perplexity Limits</h1>
  </div>

  <div id="content">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>Loading limits...</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-row">
      <span>Last updated: <span id="last-update">Never</span></span>
      <button id="refresh">Refresh Now</button>
    </div>
    <div style="margin-top: 8px;">Auto-refreshes every 30 seconds</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
